<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Книжный Шкаф: Реальные обложки</title>
    <style>
        :root {
            --bg-dark: #0a0707;
            --wood-dark: #1a1111;
            --wood-mid: #2b1f1f;
            --gold: #c49a45;
            --gold-light: #e8c87a;
            --text: #e0d8d0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #2a1a1a 0%, #0d0808 100%);
            color: var(--text);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            perspective: 1500px;
        }

        /* --- ШКАФ --- */
        .cabinet-wrapper {
            width: 100%;
            max-width: 1150px;
            background: #110c0c;
            border: 15px solid #0a0606;
            border-radius: 8px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.95), 0 20px 50px rgba(0,0,0,0.9);
            padding: 20px;
            display: flex;
            gap: 20px;
            position: relative;
        }

        /* --- ЛЕВАЯ ПАНЕЛЬ --- */
        .sidebar {
            width: 190px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-top: 20px;
            border-right: 1px solid rgba(196, 154, 69, 0.2);
            padding-right: 15px;
        }

        .sidebar h1 {
            font-size: 1.3em;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .sidebar p { font-size: 0.8em; color: #888; font-style: italic; margin-bottom: 15px; }

        .menu-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            color: #aaa; font-size: 0.9em; cursor: pointer; border-radius: 4px; transition: all 0.3s;
        }
        .menu-item:hover { background: rgba(196, 154, 69, 0.1); color: var(--gold); }
        .menu-item.active { background: rgba(139, 30, 30, 0.3); color: var(--gold-light); border-left: 3px solid var(--gold); }

        .search-box { margin-top: 5px; display: flex; flex-direction: column; gap: 5px; }
        .search-box input {
            background: rgba(0,0,0,0.6); border: 1px solid #333; color: #ccc;
            padding: 8px; border-radius: 4px; font-family: inherit; font-size: 0.8em;
            outline: none; width: 100%;
        }
        .search-box input:focus { border-color: var(--gold); }

        .quote {
            margin-top: auto; font-size: 0.75em; color: #666;
            font-style: italic; text-align: center; padding: 10px; border-top: 1px solid #333;
        }

        /* --- ПОЛКИ --- */
        .shelves-area { flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }

        .shelf {
            display: flex; flex-direction: column; position: relative; min-height: 150px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);
            border-bottom: 12px solid var(--wood-mid);
            box-shadow: 0 12px 0 #0a0606, 0 15px 20px rgba(0,0,0,0.9), inset 0 -8px 20px rgba(0,0,0,0.6);
            padding: 0 15px 15px 15px;
        }

        .shelf-label {
            position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(to bottom, #4a3520, #1a0f0a);
            border: 1px solid #6b4a30; border-radius: 4px; padding: 5px 25px;
            color: var(--gold-light); font-size: 0.85em; letter-spacing: 1px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.7); z-index: 5;
            display: flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .shelf-label .icon { font-size: 1.1em; }

        .books-container {
            display: flex; flex-wrap: wrap; gap: 2px; align-items: flex-end;
            min-height: 110px; padding-top: 25px;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(0,0,0,0.15) 60px, rgba(0,0,0,0.15) 62px);
        }

        /* --- 3D КНИГА --- */
        .book-3d {
            position: relative; width: 42px; height: 140px;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
            cursor: pointer;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.8);
        }

        .book-3d:hover {
            transform: translateY(-15px) rotateY(-15deg) scale(1.02);
            box-shadow: 0 20px 30px rgba(0,0,0,0.9), 0 0 15px rgba(196, 154, 69, 0.3);
            z-index: 10;
        }

        .book-spine {
            position: absolute; width: 100%; height: 100%;
            transform: translateZ(0); border-radius: 2px 4px 4px 2px;
            display: flex; align-items: center; justify-content: center;
            writing-mode: vertical-rl; text-orientation: mixed; padding: 10px 0; overflow: hidden;
            background-image: linear-gradient(to right, rgba(0,0,0,0.6) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.6) 100%);
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.5), inset 2px 0 5px rgba(0,0,0,0.3);
        }

        .book-spine .title {
            font-size: 0.7em; color: #ddd; text-shadow: 1px 1px 2px #000;
            max-height: 120px; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; font-weight: bold; padding: 0 4px;
        }

        /* Реальная обложка при наведении */
        .book-cover-3d {
            position: absolute; width: 100px; height: 100%; right: 0;
            transform-origin: right center; transform: rotateY(-90deg);
            border-radius: 2px 0 0 2px; background-size: cover; background-position: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
            background-color: #222;
        }
        .book-3d:hover .book-cover-3d { opacity: 1; }

        /* Цвета корешков */
        .spine-dragon { background-color: #4a0000; border-left: 2px solid #8b0000; }
        .spine-kitsune { background-color: #4a004a; border-left: 2px solid #8b008b; }
        .spine-tengu { background-color: #2a0000; border-left: 2px solid #4a0000; }
        .spine-neko { background-color: #4a3a00; border-left: 2px solid #8b6914; }
        .spine-kappa { background-color: #003a00; border-left: 2px solid #006400; }
        .spine-tanuki { background-color: #2a1a0a; border-left: 2px solid #5c4033; }
        .spine-yurei { background-color: #002a3a; border-left: 2px solid #4682b4; }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
            z-index: 100; padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .book-card {
            background: linear-gradient(135deg, #2a1f1f, #1a1111);
            border: 2px solid var(--gold); border-radius: 8px;
            width: 100%; max-width: 700px; padding: 30px;
            box-shadow: 0 0 80px rgba(0,0,0,0.95); position: relative;
            display: flex; gap: 30px; animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .book-cover-large {
            width: 180px; height: 270px; flex-shrink: 0;
            border-radius: 4px; box-shadow: 10px 10px 30px rgba(0,0,0,0.8);
            background-size: cover; background-position: center;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            color: #666; font-size: 0.8em; text-align: center;
        }

        .book-details { flex-grow: 1; display: flex; flex-direction: column; }
        .book-title { font-size: 1.8em; color: var(--gold); margin: 0 0 10px 0; line-height: 1.2; }
        .book-author { font-style: italic; color: #aaa; margin-bottom: 25px; font-size: 1.1em; }

        .rating-system { margin-top: auto; border-top: 1px solid #444; padding-top: 20px; }
        .rating-title { font-size: 0.9em; color: #bbb; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; }

        .yokai-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

        .yokai-btn {
            background: rgba(0,0,0,0.5); border: 1px solid #444;
            border-radius: 6px; padding: 10px 5px; cursor: pointer;
            text-align: center; transition: all 0.2s; font-size: 0.75em;
            display: flex; flex-direction: column; align-items: center; gap: 5px; color: #ccc;
        }
        .yokai-btn:hover { background: rgba(196, 154, 69, 0.2); border-color: var(--gold); transform: translateY(-2px); }
        .yokai-btn.active { background: rgba(139, 30, 30, 0.7); border-color: #ff4500; box-shadow: 0 0 15px rgba(139, 30, 30, 0.9); color: #fff; }
        .yokai-icon { font-size: 1.6em; }

        .close-btn {
            position: absolute; top: 10px; right: 15px; background: none; border: none;
            color: #aaa; font-size: 2em; cursor: pointer; padding: 0; line-height: 1; transition: color 0.3s;
        }
        .close-btn:hover { color: #ff4500; }

        .delete-btn {
            background: #3a0000; color: #ff8888; border: 1px solid #6a0000;
            margin-top: 20px; width: 100%; font-size: 0.9em; padding: 12px;
            border-radius: 4px; cursor: pointer; font-family: inherit; transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .delete-btn:hover { background: #6a0000; color: white; box-shadow: 0 0 15px #6a0000; }

        /* --- ФОРМА ДОБАВЛЕНИЯ КНИГИ --- */
        .add-form-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
            z-index: 200; padding: 20px;
        }
        .add-form-overlay.active { display: flex; }

        .add-form {
            background: linear-gradient(135deg, #2a1f1f, #1a1111);
            border: 2px solid var(--gold); border-radius: 8px;
            width: 100%; max-width: 500px; padding: 30px;
            box-shadow: 0 0 80px rgba(0,0,0,0.95); position: relative;
            display: flex; flex-direction: column; gap: 15px;
        }

        .add-form h2 { color: var(--gold); text-align: center; margin-bottom: 10px; font-size: 1.4em; }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.85em; color: #aaa; }
        .form-group input {
            background: rgba(0,0,0,0.6); border: 1px solid #444; color: #ddd;
            padding: 10px; border-radius: 4px; font-family: inherit; font-size: 0.95em;
            outline: none;
        }
        .form-group input:focus { border-color: var(--gold); }

        .preview-cover {
            width: 120px; height: 180px; margin: 0 auto;
            background: #222; border: 1px solid #444; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            color: #666; font-size: 0.75em; text-align: center;
            background-size: cover; background-position: center;
        }

        .form-actions { display: flex; gap: 10px; margin-top: 10px; }
        .form-actions button { flex: 1; }

        .btn-find {
            background: #3a2a00; color: #ffd700; border: 1px solid #8b6914;
            padding: 10px; border-radius: 4px; cursor: pointer; font-family: inherit;
            font-size: 0.9em; transition: all 0.3s;
        }
        .btn-find:hover { background: #5a4000; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }

        .btn-save {
            background: #2a3a00; color: #aaffaa; border: 1px solid #4a6a00;
            padding: 10px; border-radius: 4px; cursor: pointer; font-family: inherit;
            font-size: 0.9em; transition: all 0.3s;
        }
        .btn-save:hover { background: #3a5a00; box-shadow: 0 0 15px rgba(170, 255, 170, 0.3); }

        /* --- АДАПТИВ --- */
        @media (max-width: 850px) {
            .cabinet-wrapper { flex-direction: column; padding: 10px; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #333; padding-bottom: 15px; }
            .book-card { flex-direction: column; align-items: center; padding: 20px; }
            .book-cover-large { width: 140px; height: 210px; }
            .yokai-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div class="cabinet-wrapper">
        <div class="sidebar">
            <h1>МОЙ<br>КНИЖНЫЙ<br>ШКАФ</h1>
            <p>Книги. Музыка. Я.</p>
            
            <div class="menu-item active"><span>🔍</span> Поиск</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Введите название...">
            </div>
            <div class="menu-item" onclick="openAddForm()"><span>📖</span> Добавить книгу</div>
            <div class="menu-item"><span>📚</span> Мой шкаф</div>
            <div class="menu-item"><span>📜</span> Списки</div>
            <div class="menu-item"><span>📊</span> Статистика</div>
            <div class="menu-item"><span>⚙️</span> Настройки</div>

            <div class="quote">"Хорошие книги всегда находят свой дом." 🐾</div>
        </div>

        <div class="shelves-area" id="shelvesArea"></div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО КНИГИ -->
    <div class="modal-overlay" id="modal">
        <div class="book-card">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div class="book-cover-large" id="modalCover"></div>
            <div class="book-details">
                <h2 class="book-title" id="modalTitle">Название</h2>
                <div class="book-author" id="modalAuthor">Автор</div>
                <div class="rating-system">
                    <div class="rating-title">Оценка Екая:</div>
                    <div class="yokai-grid" id="yokaiGrid"></div>
                </div>
                <button class="delete-btn" onclick="deleteBook()">Удалить книгу</button>
            </div>
        </div>
    </div>

    <!-- ФОРМА ДОБАВЛЕНИЯ КНИГИ -->
    <div class="add-form-overlay" id="addForm">
        <div class="add-form">
            <button class="close-btn" onclick="closeAddForm()">&times;</button>
            <h2>📖 Добавить книгу</h2>
            
            <div class="form-group">
                <label>Название книги:</label>
                <input type="text" id="newTitle" placeholder="Например: Мастер и Маргарита">
            </div>
            
            <div class="form-group">
                <label>Автор:</label>
                <input type="text" id="newAuthor" placeholder="Например: Михаил Булгаков">
            </div>

            <div class="preview-cover" id="previewCover">Обложка не найдена</div>

            <button class="btn-find" onclick="findCover()">🔍 Найти обложку в Google Books</button>
            
            <div class="form-actions">
                <button class="btn-save" onclick="saveBook()">💾 Сохранить книгу</button>
            </div>
        </div>
    </div>

    <script>
        // --- ДАННЫЕ ЕКАЕВ ---
        const yokaiList = [
            { id: 'dragon', name: 'Дракон', score: 10, icon: '🐉', class: 'dragon', color: '#8b0000' },
            { id: 'kitsune', name: 'Кицунэ', score: 9, icon: '🦊', class: 'kitsune', color: '#8b008b' },
            { id: 'neko', name: 'Нэко', score: 8, icon: '🐈', class: 'neko', color: '#8b6914' },
            { id: 'tengu', name: 'Тэнгу', score: 7, icon: '👺', class: 'tengu', color: '#4a0000' },
            { id: 'kappa', name: 'Каппа', score: 6, icon: '🐢', class: 'kappa', color: '#006400' },
            { id: 'tanuki', name: 'Тануки', score: 5, icon: '🦝', class: 'tanuki', color: '#5c4033' },
            { id: 'yurei', name: 'Юрэй', score: 4, icon: '👻', class: 'yurei', color: '#4682b4' }
        ];

        // Начальные книги с реальными обложками (Google Books)
        let books = [
            { id: 1, title: 'Властелин Колец', author: 'Дж. Р. Р. Толкин', rating: 'dragon', coverUrl: 'https://books.google.com/books/content?id=1&printsec=frontcover&img=1&zoom=1' },
            { id: 2, title: 'Хоббит', author: 'Дж. Р. Р. Толкин', rating: 'kitsune', coverUrl: 'https://books.google.com/books/content?id=2&printsec=frontcover&img=1&zoom=1' }
        ];

        let currentBookId = null;
        let currentFilter = '';
        let tempCoverUrl = '';

        document.addEventListener('DOMContentLoaded', () => {
            renderShelves();
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentFilter = e.target.value;
                renderShelves();
            });
        });

        // --- ПОИСК ОБЛОЖКИ ЧЕРЕЗ GOOGLE BOOKS API ---
        async function findCover() {
            const title = document.getElementById('newTitle').value.trim();
            const author = document.getElementById('newAuthor').value.trim();
            
            if (!title) {
                alert('Введите название книги');
                return;
            }

            const preview = document.getElementById('previewCover');
            preview.textContent = 'Поиск...';
            preview.style.backgroundImage = 'none';

            try {
                // Формируем запрос к Google Books API
                const query = encodeURIComponent(`intitle:${title}${author ? `+inauthor:${author}` : ''}`);
                const url = `https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    const bookInfo = data.items[0].volumeInfo;
                    const imageLinks = bookInfo.imageLinks;
                    
                    if (imageLinks && imageLinks.thumbnail) {
                        // Заменяем http на https и увеличиваем размер
                        let coverUrl = imageLinks.thumbnail.replace('http://', 'https://');
                        coverUrl = coverUrl.replace('zoom=1', 'zoom=2');
                        
                        tempCoverUrl = coverUrl;
                        preview.style.backgroundImage = `url(${coverUrl})`;
                        preview.textContent = '';
                        
                        // Автозаполняем автора, если он не был указан
                        if (!author && bookInfo.authors) {
                            document.getElementById('newAuthor').value = bookInfo.authors.join(', ');
                        }
                    } else {
                        preview.textContent = 'Обложка не найдена';
                        tempCoverUrl = '';
                    }
                } else {
                    preview.textContent = 'Книга не найдена';
                    tempCoverUrl = '';
                }
            } catch (error) {
                console.error('Ошибка:', error);
                preview.textContent = 'Ошибка поиска';
                tempCoverUrl = '';
            }
        }

        // --- СОХРАНЕНИЕ КНИГИ ---
        function saveBook() {
            const title = document.getElementById('newTi
