<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой шкаф</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0a08;
    background-image: radial-gradient(ellipse at top, #2a1f18 0%, #0f0a08 70%);
    color: #e8e0d5;
    padding: 12px;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  .page-title {
    text-align: center;
    font-size: 13px;
    letter-spacing: 3px;
    color: #d4a574;
    margin-bottom: 12px;
    font-weight: 300;
  }

  /* ===== ШКАФ ===== */
  .cabinet {
    max-width: 500px;
    margin: 0 auto;
    background: linear-gradient(180deg, #2a1a0f 0%, #1a0f08 100%);
    border: 3px solid #4a3520;
    border-radius: 6px;
    box-shadow: 
      inset 0 0 40px rgba(0,0,0,0.6),
      0 10px 40px rgba(0,0,0,0.8),
      0 0 0 1px rgba(212,165,116,0.15);
    padding: 10px;
    position: relative;
  }
  .cabinet::before {
    content: '';
    position: absolute;
    top: -8px; left: 10px; right: 10px;
    height: 8px;
    background: linear-gradient(180deg, #5a3f25, #2a1a0f);
    border-radius: 4px 4px 0 0;
    border: 1px solid #4a3520;
    border-bottom: none;
  }

  .cabinet-inner {
    background: linear-gradient(180deg, #150c06 0%, #1a0f08 100%);
    border: 2px solid #3a2818;
    border-radius: 3px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    padding: 0;
    overflow: hidden;
  }

  /* ===== ПОЛКА ===== */
  .shelf {
    position: relative;
    min-height: 150px;
    padding: 12px 10px 8px;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    flex-wrap: wrap;
    border-bottom: 6px solid #3a2510;
    background: linear-gradient(180deg, rgba(60,40,25,0.15) 0%, rgba(20,12,6,0.6) 100%);
    box-shadow: inset 0 -8px 20px rgba(0,0,0,0.5);
  }
  .shelf:last-child { border-bottom: none; }

  .shelf::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(180deg, #4a3520 0%, #2a1a0f 100%);
    border-top: 1px solid #5a4030;
    box-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }

  .shelf-empty {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #4a3520;
    font-size: 11px;
    font-style: italic;
    pointer-events: none;
    letter-spacing: 1px;
  }

  /* ===== КНИГА ===== */
  .book {
    width: 28px;
    height: 130px;
    border-radius: 2px 3px 3px 2px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6px 2px 4px 4px;
    transition: transform 0.15s;
    box-shadow: 
      inset -3px 0 6px rgba(0,0,0,0.4),
      inset 2px 0 4px rgba(255,255,255,0.08),
      2px 2px 5px rgba(0,0,0,0.6);
    flex-shrink: 0;
  }
  .book:active { transform: translateY(-3px); }
  .book-title {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 9px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-height: 90px;
    line-height: 1;
    letter-spacing: 0.2px;
  }
  .book-rating-badge {
    font-size: 9px;
    text-align: center;
    line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.8));
    flex-shrink: 0;
  }
  .book::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: rgba(0,0,0,0.35);
  }

  /* ===== СТАТУЭТКА ===== */
  .figurine {
    object-fit: contain;
    flex-shrink: 0;
    cursor: pointer;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.85));
    transition: transform 0.15s;
    align-self: flex-end;
    margin-bottom: 4px;
  }
  .figurine:active { transform: scale(0.92); }
  .figurine-small { width: 34px; height: 55px; }
  .figurine { width: 42px; height: 70px; }
  .figurine-tall { width: 40px; height: 100px; }

  /* ===== УПРАВЛЕНИЕ ===== */
  .controls {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }
  .controls button {
    flex: 1;
    padding: 12px;
    background: rgba(60,40,25,0.6);
    border: 1px solid #4a3520;
    border-radius: 10px;
    color: #d4a574;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .controls button:active { background: rgba(80,55,35,0.8); }

  /* ===== МОДАЛКИ ===== */
  .modal-bg {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    z-index: 10;
    padding: 20px;
    overflow-y: auto;
    align-items: center;
    justify-content: center;
  }
  .modal-bg.active { display: flex; }
  .modal {
    background: #2a1f18;
    border: 1px solid #4a3520;
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.8);
    margin: auto;
  }
  .modal h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    text-align: center;
    color: #d4a574;
    letter-spacing: 1px;
  }
  .modal label {
    font-size: 11px;
    color: #8a7a6a;
    display: block;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .modal input, .modal select {
    width: 100%;
    padding: 11px;
    margin-bottom: 10px;
    background: #1a1410;
    border: 1px solid #4a3520;
    border-radius: 8px;
    color: #e8e0d5;
    font-size: 15px;
    font-family: inherit;
  }
  .modal input:focus, .modal select:focus { outline: none; border-color: #d4a574; }
  .modal input::placeholder { color: #5a4a3a; }

  .preview-img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    margin: 0 auto 12px;
    display: block;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 8px;
  }

  .hint {
    font-size: 11px;
    color: #6a5540;
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .rating-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin: 8px 0 14px;
  }
  .rating-btn {
    padding: 10px;
    background: #1a1410;
    border: 1px solid #4a3520;
    border-radius: 8px;
    color: #c0a080;
    font-size: 15px;
    cursor: pointer;
  }
  .rating-btn.selected { background: #d4a574; color: #1a1410; border-color: #d4a574; }

  .modal-actions { display: flex; gap: 8px; margin-top: 6px; }
  .modal-actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-cancel { background: #1a1410; color: #a08060; border: 1px solid #4a3520; }
  .btn-save { background: #d4a574; color: #1a1410; }

  .detail {
    background: #2a1f18;
    border: 1px solid #4a3520;
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    margin: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.8);
  }
  .detail-cover {
    width: 120px;
    height: 180px;
    margin: 0 auto 14px;
    border-radius: 6px;
    object-fit: cover;
    border: 1px solid #4a3520;
    background: #1a1410;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  .detail h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; color: #e8e0d5; }
  .detail .author { color: #8a7a6a; margin-bottom: 14px; font-size: 13px; }
  .detail .info { color: #8a7a6a; font-size: 12px; margin-bottom: 5px; }
  .detail .rating-word { color: #d4a574; font-size: 18px; font-weight: 700; margin: 12px 0; }
  .detail .actions { display: flex; gap: 8px; margin-top: 18px; }
  .detail .actions button {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-delete { background: #3a1a1a; color: #d47a7a; border: 1px solid #5a2a2a; }
  .btn-close { background: #d4a574; color: #1a1410; }

  .fab {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 13px 28px;
    background: #d4a574;
    color: #1a1410;
    border: none;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(212,165,116,0.4);
    z-index: 5;
  }
  .fab:active { background: #b8905a; }
</style>
</head>
<body>

<div class="page-title">МОЙ КНИЖНЫЙ ШКАФ</div>

<div class="cabinet">
  <div class="cabinet-inner" id="cabinetInner"></div>
</div>

<div class="controls">
  <button onclick="addShelf()">+ Полка</button>
  <button onclick="openAddFigurine()">+ Статуэтка</button>
</div>

<button class="fab" onclick="openAddBook()">+ КНИГА</button>

<div class="modal-bg" id="bookModal">
  <div class="modal">
    <h2>Новая книга</h2>
    <label>Название *</label>
    <input type="text" id="f-title" placeholder="Например: Тэнгу">
    <label>Автор *</label>
    <input type="text" id="f-author" placeholder="Например: Мария Вой">
    <label>Ссылка на обложку (необязательно)</label>
    <input type="text" id="f-cover" placeholder="https://...">
    <label>Оценка *</label>
    <div class="rating-buttons" id="ratingButtons"></div>
    <label>Полка *</label>
    <select id="f-shelf"></select>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-save" onclick="saveBook()">Добавить</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="figurineModal">
  <div class="modal">
    <h2>Новая статуэтка</h2>
    <img class="preview-img" id="figPreview" src="" alt="" style="display:none;">
    <label>Название (для себя)</label>
    <input type="text" id="fig-name" placeholder="Например: Лиса">
    <label>Ссылка на картинку *</label>
    <input type="text" id="fig-url" placeholder="https://..." oninput="updateFigPreview()">
    <p class="hint">
      💡 Найди PNG с прозрачным фоном в Google Картинках.<br>
      Удерживай палец → «Копировать ссылку на изображение».
    </p>
    <label>Размер</label>
    <select id="fig-size">
      <option value="figurine-small">Маленькая</option>
      <option value="figurine" selected>Средняя</option>
      <option value="figurine-tall">Высокая</option>
    </select>
    <label>Полка *</label>
    <select id="fig-shelf"></select>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-save" onclick="saveFigurine()">Добавить</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="detailModal">
  <div class="detail" id="detailContent"></div>
</div>

<script>
const STORAGE_KEY = 'my_cabinet_v2';
let shelves = loadData();
let currentRating = 0;

function loadData() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (data && Array.isArray(data)) return data;
  } catch(e) {}
  return [
    { id: Date.now(), books: [], figurines: [] },
    { id: Date.now() + 1, books: [], figurines: [] }
  ];
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(shelves));
}

function getRatingEmoji(r) {
  r = Number(r);
  if (r === 10) return '🐉';
  if (r >= 9) return '🦊';
  if (r >= 7) return '🐱';
  if (r >= 5) return '👺';
  if (r >= 3) return '🦝';
  return '👻';
}
function getRatingWord(r) {
  r = Number(r);
  if (r === 10) return '🐉 Дракон';
  if (r >= 9) return '🦊 Кицунэ';
  if (r >= 7) return '🐱 Нэко';
  if (r >= 5) return '👺 Тэнгу';
  if (r >= 3) return '🦝 Тануки';
  return '👻 Юрей';
}

const SPINE_COLORS = [
  '#8b5a2b', '#a0522d', '#6b4423', '#7c4a2d', '#9c6b3f',
  '#5a3a1f', '#704214', '#875a34', '#4a2f1a', '#a86b3c',
  '#b8860b', '#8b0000', '#556b2f', '#483d8b', '#2e5266',
  '#5d3a5c', '#3a5f3a', '#7a3a3a', '#4a3a6b', '#8b4513'
];
function colorForBook(book) {
  let h = 0;
  const s = book.title + book.author;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return SPINE_COLORS[h % SPINE_COLORS.length];
}

function addShelf() {
  shelves.push({ id: Date.now(), books: [], figurines: [] });
  saveData();
  render();
}

function openAddBook() {
  currentRating = 0;
  ['f-title','f-author','f-cover'].forEach(id => document.getElementById(id).value = '');
  const rb = document.getElementById('ratingButtons');
  rb.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'rating-btn';
    btn.textContent = getRatingEmoji(i);
    btn.onclick = () => {
      currentRating = i;
      document.querySelectorAll('#ratingButtons .rating-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    rb.appendChild(btn);
  }
  const sel = document.getElementById('f-shelf');
  sel.innerHTML = shelves.map((s, i) => `<option value="${s.id}">Полка ${i + 1}</option>`).join('');
  document.getElementById('bookModal').classList.add('active');
}

function saveBook() {
  const title = document.getElementById('f-title').value.trim();
  const author = document.getElementById('f-author').value.trim();
  const cover = document.getElementById('f-cover').value.trim();
  const shelfId = Number(document.getElementById('f-shelf').value);

  if (!title || !author) { alert('Заполни название и автора!'); return; }
  if (!currentRating) { alert('Поставь оценку!'); return; }

  const shelf = shelves.find(s => s.id === shelfId);
  if (!shelf) return;

  shelf.books.push({
    id: Date.now(),
    title, author, rating: currentRating,
    customCover: cover || null
  });
  saveData();
  render();
  closeModal();
}

function openAddFigurine() {
  ['fig-name','fig-url'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('figPreview').style.display = 'none';
  const sel = document.getElementById('fig-shelf');
  sel.innerHTML = shelves.map((s, i) => `<option value="${s.id}">Полка ${i + 1}</option>`).join('');
  document.getElementById('figurineModal').classList.add('active');
}

function updateFigPreview() {
  const url = document.getElementById('fig-url').value.trim();
  const img = document.getElementById('figPreview');
  if (url) {
    img.src = url;
    img.style.display = 'block';
    img.onerror = () => { img.style.display = 'none'; };
  } else {
    img.style.display = 'none';
  }
}

function saveFigurine() {
  const name = document.getElementById('fig-name').value.trim();
  const url = document.getElementById('fig-url').value.trim();
  const size = document.getElementById('fig-size').value;
  const shelfId = Number(document.getElementById('fig-shelf').value);

  if (!url) { alert('Вставь ссылку на картинку статуэтки!'); return; }

  const shelf = shelves.find(s => s.id === shelfId);
  if (!shelf) return;

  shelf.figurines.push({
    id: Date.now(),
    name: name || 'Статуэтка',
    url, size
  });
  saveData();
  render();
  closeModal();
}

function render() {
  const container = document.getElementById('cabinetInner');
  container.innerHTML = shelves.map((shelf, shelfIdx) => {
    return `
      <div class="shelf">
        ${shelf.books.length === 0 && shelf.figurines.length === 0 ? '<div class="shelf-empty">пусто</div>' : ''}
        ${shelf.books.map(b => {
          const color = colorForBook(b);
          return `<div class="book" style="background:${color};" onclick="openBookDetail(${shelfIdx}, ${b.id})">
            <div class="book-title">${escapeHtml(b.title)}</div>
            <div class="book-rating-badge">${getRatingEmoji(b.rating)}</div>
          </div>`;
        }).join('')}
        ${shelf.figurines.map(f => 
          `<img class="figurine ${f.size}" src="${f.url}" onclick="openFigurineDetail(${shelfIdx}, ${f.id})" onerror="this.style.display='none'">`
        ).join('')}
      </div>
    `;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openBookDetail(shelfIdx, bookId) {
  const book = shelves[shelfIdx].books.find(b => b.id === bookId);
  if (!book) return;
  const coverUrl = book.customCover || '';
  const imgHtml = coverUrl
    ? `<img class="detail-cover" src="${coverUrl}" onerror="this.outerHTML='<div class=\\'detail-cover\\' style=\\'display:flex;align-items:center;justify-content:center;font-size:40px;\\'>📖</div>'">`
    : `<div class="detail-cover" style="display:flex;align-items:center;justify-content:center;font-size:40px;">📖</div>`;
  document.getElementById('detailContent').innerHTML = `
    ${imgHtml}
    <h2>${escapeHtml(book.title)}</h2>
    <div class="author">${escapeHtml(book.author)}</div>
    <div class="rating-word">${getRatingWord(book.rating)}</div>
    <div class="info">Оценка: ${book.rating}/10</div>
    <div class="actions">
      <button class="btn-delete" onclick="deleteBook(${shelfIdx}, ${book.id})">Удалить</button>
      <button class="btn-close" onclick="closeModal()">Закрыть</button>
    </div>
  `;
  document.getElementById('detailModal').classList.add('active');
}

function openFigurineDetail(shelfIdx, figId) {
  const fig = shelves[shelfIdx].figurines.find(f => f.id === figId);
  if (!fig) return;
  document.getElementById('detailContent').innerHTML = `
    <img src="${fig.url}" style="max-width:100%; max-height:200px; object-fit:contain; margin-bottom:16px;">
    <h2>${escapeHtml(fig.name)}</h2>
    <div class="info">Статуэтка на полке ${shelfIdx + 1}</div>
    <div class="actions" style="margin-top:18px;">
      <button class="btn-delete" onclick="deleteFigurine(${shelfIdx}, ${fig.id})">Удалить</button>
      <button class="btn-close" onclick="closeModal()">Закрыть</button>
    </div>
  `;
  document.getElementById('detailModal').classList.add('active');
}

function deleteBook(shelfIdx, bookId) {
  if (!confirm('Удалить книгу?')) return;
  shelves[shelfIdx].books = shelves[shelfIdx].books.filter(b => b.id !== bookId);
  saveData();
  render();
  closeModal();
}

function deleteFigurine(shelfIdx, figId) {
  if (!confirm('Удалить статуэтку?')) return;
  shelves[shelfIdx].figurines = shelves[shelfIdx].figurines.filter(f => f.id !== figId);
  saveData();
  render();
  closeModal();
}

function closeModal() {
  document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('active'));
}

render();
</script>

</body>
</html>
